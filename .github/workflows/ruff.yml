name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install validation tooling
        run: python -m pip install --upgrade pip ida-hcli ruff
      - name: Verify HCLI runtime imports
        run: python -c "import hcli.main"
      - name: Verify metadata sync
        run: python scripts/verify_metadata_sync.py --repo .
      - name: Verify settings sync
        run: python scripts/verify_settings_sync.py --repo .
      - name: Run quality checks
        run: python scripts/run_quality_checks.py --repo .
      - name: Build plugin archive
        run: python scripts/package_plugin.py --repo . --output dist/mcrit-ida.zip
      - name: Lint HCLI package metadata
        run: |
          hcli plugin lint .
          hcli plugin lint dist/mcrit-ida.zip
