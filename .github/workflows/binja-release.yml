# Publishes the Binary Ninja plugin with Vector35/plugin_actions, the release action of Vector35's
# sample plugin. extensions.binary.ninja reads plugin.json at the commit of the latest GitHub
# release and only looks at its "version" field; tag names and release titles are never parsed.
name: Binary Ninja release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (leave blank to bump the last number, e.g. 1.0.0 -> 1.0.1)"
        required: false
        default: ""
        type: string
      description:
        description: "Release notes shown in the extension manager (leave blank to generate them)"
        required: false
        default: ""
        type: string
      dry-run:
        description: "Validate only: report the version that would be released without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: binja-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    # plugin_actions always releases the default branch, whichever ref the workflow was started from
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record the verified commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests ruff

      - name: Verify settings sync
        run: python scripts/common/verify_settings_sync.py --repo .

      - name: Run quality checks
        run: python scripts/common/run_quality_checks.py --repo .

      - name: Run pure Python tests
        run: python -m pytest tests

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # plugin_actions needs full history and tags to refuse reused versions, and the persisted
          # token to push the version commit and tag
          fetch-depth: 0

      - name: Refuse to release an unverified commit
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$VERIFIED_SHA" ]; then
            echo "::error::The default branch moved after verification; run the release again."
            exit 1
          fi

      - name: Bump plugin.json, tag and publish the release
        uses: Vector35/plugin_actions@9ea98e06c5aa58a8e2d973c91af583beaecb0efd # v1.1.0
        with:
          checkout: "false"
          version: ${{ inputs.version }}
          description: ${{ inputs.description }}
          dry-run: ${{ inputs.dry-run }}
