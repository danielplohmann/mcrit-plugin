name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: python -m pip install --upgrade pip ida-hcli ruff

      - name: Verify HCLI runtime imports
        run: python -c "import hcli.main"

      - name: Derive release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify metadata sync
        run: python scripts/verify_metadata_sync.py --repo . --expected-version "${{ steps.version.outputs.value }}"

      - name: Verify settings sync
        run: python scripts/verify_settings_sync.py --repo .

      - name: Run quality checks
        run: python scripts/run_quality_checks.py --repo .

      - name: Build plugin archive
        run: python scripts/package_plugin.py --repo . --output dist/mcrit-ida-${{ steps.version.outputs.value }}.zip

      - name: Lint HCLI package metadata
        run: |
          hcli plugin lint .
          hcli plugin lint dist/mcrit-ida-${{ steps.version.outputs.value }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: mcrit-ida ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/mcrit-ida-${{ steps.version.outputs.value }}.zip
