name: Release

# Pushing a vX.Y.Z tag is the release. Nothing is published to a package index: this repository is
# deployed from a checkout, so the release is the tag, the GitHub release page carrying that
# version's changelog section, and the built artifacts attached to it as a convenience.
on:
  push:
    tags:
      - "ida-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the tag against the declared version and the changelog
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python .github/workflows/scripts/release_guard.py \
            --tag "${TAG}" --notes release-notes.md --github-output "${GITHUB_OUTPUT}"

      - name: Check the tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${TAG}" origin/main; then
            echo "::error::${TAG} is not an ancestor of main; releases are cut from main."
            exit 1
          fi

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api \
            "repos/${REPO}/actions/workflows/pytest.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '.workflow_runs[0].conclusion // ""')
          if [ -z "${conclusion}" ]; then
            echo "::error::No completed CI run for ${SHA}. Wait for main to go green, then re-run."
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI concluded '${conclusion}' for ${SHA}. Fix main before releasing."
            exit 1
          fi
          echo "CI passed on ${SHA}"

      - name: Keep the release notes for the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Validate and build the plugin archive
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release tooling
        run: python -m pip install --upgrade pip ida-hcli ruff

      - name: Verify HCLI runtime imports
        run: python -c "import hcli.main"

      - name: Derive release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#ida-v}" >> "$GITHUB_OUTPUT"

      - name: Verify metadata sync
        run: python scripts/ida/verify_metadata_sync.py --repo . --expected-version "${{ steps.version.outputs.value }}"

      - name: Verify settings sync
        run: python scripts/common/verify_settings_sync.py --repo .

      - name: Run quality checks
        run: python scripts/common/run_quality_checks.py --repo .

      - name: Build plugin archive
        run: python scripts/ida/package_plugin.py --repo . --output dist/mcrit-ida-${{ steps.version.outputs.value }}.zip

      - name: Lint HCLI package metadata
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          hcli plugin lint dist/mcrit-ida-${{ steps.version.outputs.value }}.zip

      - name: Keep the artifacts for the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcrit-ida ${{ github.ref_name }}
          generate_release_notes: true
          # extensions.binary.ninja reads plugin.json at the latest release; only Binary Ninja releases may be latest
          make_latest: false
          files: dist/mcrit-ida-${{ steps.version.outputs.value }}.zip
